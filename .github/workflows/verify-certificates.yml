name: Verify public certificates
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check cryptography
      - run: python scripts/check_site.py
      - run: python certificates/cand-467-question-seal/verify_certificate.py certificates/cand-467-question-seal/certificate.json certificates/cand-467-question-seal/public-key.pem
